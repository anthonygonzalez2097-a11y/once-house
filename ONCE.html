  <title>Mi Página Web</title>

      background-repeat: repeat;
      background-size: 220px 220px;
      color: #ffffff;
      line-height: 1.5;
    }

    /* Colores de la temática: negro de fondo, naranja de acento */
    a {
      color: #ff8c00;
    }

    h1, h2, h3 {
      color: #ff8c00;
    }

    /* Contenedor principal: se adapta a cualquier tamaño de pantalla */
    .contenedor {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Encabezado con el logo */
    .encabezado {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 10px;
    }

    .logo {
      max-width: 280px;
      width: 60%;
      height: auto;
    }

    /* En pantallas pequeñas, el logo se ajusta un poco más */
    @media (max-width: 600px) {
      .logo {
        max-width: 200px;
        width: 70%;
      }
    }

    /* Fecha y hora en la esquina superior izquierda */
    .fecha-hora {
      position: fixed;
      top: 15px;
      left: 15px;
      background-color: #111111;
      border: 1px solid #ff8c00;
      border-radius: 10px;
      padding: 4px 8px;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      z-index: 100;
      box-shadow: 0 0 10px rgba(255, 140, 0, 0.4);
    }

    .fecha-hora .fecha {
      color: #ffffff;
      font-size: 8px;
      letter-spacing: 0.3px;
      text-transform: capitalize;
    }

    .fecha-hora .hora {
      color: #ff8c00;
      font-size: 12px;
      font-weight: bold;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    @media (max-width: 600px) {
      .fecha-hora {
        top: 8px;
        left: 8px;
        padding: 3px 6px;
        border-radius: 8px;
      }
      .fecha-hora .fecha {
        font-size: 6px;
      }
      .fecha-hora .hora {
        font-size: 10px;
      }
    }

    /* Botones de opciones: Ver Menú y Ubicación */
    .opciones {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .boton-opcion {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #ff8c00;
      color: #000000;
      font-weight: bold;
      text-decoration: none;
      font-size: 16px;
      padding: 14px 32px;
      border-radius: 30px;
      border: 2px solid #ff8c00;
      transition: background-color 0.3s ease, color 0.3s ease, transform 0.2s ease;
      text-align: center;
    }

    .icono-boton {
      width: 18px;
      height: 18px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .boton-opcion:hover {
      background-color: #000000;
      color: #ff8c00;
      transform: translateY(-3px);
    }

    @media (max-width: 600px) {
      .opciones {
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .boton-opcion {
        width: 80%;
        font-size: 15px;
        padding: 12px 20px;
      }
    }

    /* Iconos de redes sociales en la esquina superior derecha */
    .redes-sociales {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 12px;
      z-index: 100;
    }

    .redes-sociales a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      background-color: #111111;
      border: 1px solid #ff8c00;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 140, 0, 0.4);
      transition: transform 0.2s ease, background-color 0.3s ease;
    }

    .redes-sociales a:hover {
      background-color: #ff8c00;
      transform: translateY(-3px);
    }

    .redes-sociales svg {
      width: 22px;
      height: 22px;
      fill: #ff8c00;
      transition: fill 0.3s ease;
    }

    .redes-sociales a:hover svg {
      fill: #000000;
    }

    @media (max-width: 600px) {
      .redes-sociales {
        top: 8px;
        right: 8px;
        gap: 8px;
      }
      .redes-sociales a {
        width: 34px;
        height: 34px;
      }
      .redes-sociales svg {
        width: 18px;
        height: 18px;
      }
    }

    /* Sección del menú (Comida / Bebidas) */
    .seccion-menu {
      margin-top: 50px;
      text-align: center;
      scroll-margin-top: 30px;
    }

    .seccion-menu h2 {
      font-size: 26px;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      .seccion-menu {
        margin-top: 30px;
      }
      .seccion-menu h2 {
        font-size: 20px;
      }
    }

    /* Sistema de vistas: Principal / Menú (como pantallas distintas) */
    .vista-oculta {
      display: none !important;
    }

    .boton-volver {
      display: inline-block;
      background-color: transparent;
      color: #ff8c00;
      font-weight: bold;
      text-decoration: none;
      font-size: 14px;
      padding: 10px 20px;
      border: none;
      margin-top: 6px;
    }

    .boton-volver:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .boton-volver {
        width: 80%;
        text-align: center;
      }
    }

    /* Sección Comida: título y cuadrícula de platillos */
    .titulo-seccion {
      text-align: center;
      font-size: 26px;
      margin-bottom: 24px;
    }

    .seccion-mas-vendidos {
      margin-top: 40px;
    }

    .cuadricula-platillos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 200px));
      justify-content: center;
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* Subcategorías dentro de Comida */
    .subcategorias-comida {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      max-width: 900px;
      margin: 0 auto 24px;
    }

    .boton-categoria {
      background-color: #111111;
      border: 1px solid #ff8c00;
      color: #ffffff;
      font-size: 13px;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .boton-categoria:hover {
      background-color: #ff8c00;
      color: #000000;
    }

    .boton-categoria.categoria-activa {
      background-color: #ff8c00;
      color: #000000;
    }

    .tarjeta-oculta-categoria {
      display: none !important;
    }

    @media (max-width: 600px) {
      .subcategorias-comida {
        gap: 8px;
      }
      .boton-categoria {
        font-size: 12px;
        padding: 6px 12px;
      }
    }

    .tarjeta-platillo {
      background-color: #111111;
      border: 1px solid #ff8c00;
      border-radius: 12px;
      overflow: hidden;
      text-align: center;
      padding-bottom: 14px;
      box-shadow: 0 0 10px rgba(255, 140, 0, 0.25);
      position: relative;
    }

    /* Recuadro de promoción en la pantalla principal */
    .seccion-promocion {
      margin-top: 40px;
      text-align: center;
    }

    .seccion-promocion h2 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .tarjeta-promocion {
      border-color: #ff8c00;
      box-shadow: 0 0 16px rgba(255, 140, 0, 0.5);
    }

    .tarjeta-promocion .precio-platillo {
      display: none;
    }

    .seccion-promocion .cuadricula-platillos {
      grid-template-columns: minmax(150px, 200px);
      justify-content: center;
    }

    .etiqueta-promocion {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 2;
      background-color: #ff8c00;
      color: #000000;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 10px;
    }

    @media (max-width: 600px) {
      .seccion-promocion {
        margin-top: 24px;
      }
      .seccion-promocion h2 {
        font-size: 18px;
      }
    }

    .foto-platillo {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #ff8c00;
    }

    .foto-platillo svg {
      width: 40%;
      height: 40%;
      fill: #ff8c00;
      opacity: 0.6;
    }

    .foto-platillo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tarjeta-platillo h3 {
      font-size: 15px;
      margin: 12px 10px 4px;
      color: #ffffff;
    }

    .descripcion-platillo {
      font-size: 12px;
      color: #cccccc;
      margin: 0 10px 8px;
    }

    .precio-platillo {
      display: inline-block;
      font-weight: bold;
      color: #ff8c00;
      font-size: 14px;
    }

    .encabezado-seccion {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      gap: 16px;
      max-width: 900px;
      margin: 0 auto 24px;
    }

    .encabezado-seccion .titulo-seccion {
      margin: 0;
      cursor: pointer;
      transition: font-size 0.25s ease, color 0.25s ease, opacity 0.25s ease;
    }

    .titulo-activo {
      font-size: 26px;
      color: #ff8c00;
      opacity: 1;
    }

    .titulo-inactivo {
      font-size: 15px;
      color: #ffffff;
      opacity: 0.5;
    }

    .titulo-inactivo:hover {
      opacity: 0.85;
    }

    .boton-volver-derecha {
      position: absolute;
      right: 0;
      background-color: #111111;
      border: 1px solid #ff8c00;
      border-radius: 30px;
      padding: 8px 18px;
      box-shadow: 0 0 10px rgba(255, 140, 0, 0.4);
      font-size: 14px;
    }

    #vista-comida,
    #vista-bebidas,
    #vista-extras,
    .seccion-categoria-personalizada {
      padding-top: 30px;
    }

    @media (max-width: 600px) {
      .encabezado-seccion {
        flex-wrap: wrap;
        gap: 10px;
      }
      .titulo-activo {
        font-size: 20px;
      }
      .titulo-inactivo {
        font-size: 12px;
      }
      .boton-volver-derecha {
        position: static;
        font-size: 13px;
        padding: 6px 16px;
        width: 100%;
        order: 3;
      }
      #vista-comida,
      #vista-bebidas,
      #vista-extras {
        padding-top: 20px;
      }
    }

    @media (max-width: 600px) {
      .titulo-seccion {
        font-size: 20px;
      }
      .cuadricula-platillos {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
    }

    /* Ejemplo de ajuste responsive para pantallas pequeñas (celulares) */
    @media (max-width: 600px) {
      .contenedor {
        padding: 10px;
      }
    }

    /* ===== Carrito de compras ===== */
    .control-cantidad-tarjeta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      background-color: #000000;
      border: 1px solid #ff8c00;
      border-radius: 16px;
      padding: 2px 7px;
    }

    .boton-cantidad-tarjeta {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: none;
      background-color: #ff8c00;
      color: #000000;
      font-size: 11px;
      font-weight: bold;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }

    .boton-cantidad-tarjeta:hover {
      transform: translateY(-1px);
    }

    .boton-cantidad-tarjeta:active {
      transform: translateY(0);
    }

    .cantidad-tarjeta {
      min-width: 12px;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      color: #ffffff;
    }

    .boton-carrito-flotante {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 150;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: #ff8c00;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(255, 140, 0, 0.6);
      transition: transform 0.2s ease;
    }

    .boton-carrito-flotante:hover {
      transform: translateY(-3px);
    }

    .boton-carrito-flotante svg {
      width: 26px;
      height: 26px;
      fill: #000000;
    }

    .boton-ajustes-flotante {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 150;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: rgba(17, 17, 17, 0.7);
      border: 1px solid rgba(255, 140, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 18px;
      opacity: 0.55;
      transition: opacity 0.2s ease;
    }

    .boton-ajustes-flotante:hover {
      opacity: 1;
    }

    .contador-carrito {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 20px;
      height: 20px;
      padding: 0 4px;
      border-radius: 10px;
      background-color: #000000;
      color: #ff8c00;
      border: 1px solid #ff8c00;
      font-size: 11px;
      font-weight: bold;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-carrito {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .fondo-modal-carrito {
      position: absolute;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.7);
    }

    .panel-carrito {
      position: relative;
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      background-color: #111111;
      border: 1px solid #ff8c00;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 0 20px rgba(255, 140, 0, 0.4);
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .encabezado-carrito {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .encabezado-carrito h2 {
      font-size: 20px;
      margin: 0;
    }

    .boton-cerrar-carrito {
      background: none;
      border: none;
      color: #ff8c00;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
    }

    .carrito-vacio {
      text-align: center;
      color: #cccccc;
      padding: 30px 10px;
      font-size: 14px;
    }

    .items-carrito {
      overflow-y: auto;
      flex: 1;
    }

    .fila-carrito {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #222222;
    }

    .info-item-carrito {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .nombre-item-carrito {
      font-size: 14px;
      color: #ffffff;
    }

    .precio-item-carrito {
      font-size: 11px;
      color: #cccccc;
    }

    .controles-item-carrito {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .boton-cantidad {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid #ff8c00;
      background-color: transparent;
      color: #ff8c00;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cantidad-item-carrito {
      min-width: 18px;
      text-align: center;
      font-size: 13px;
    }

    .subtotal-item-carrito {
      font-size: 13px;
      font-weight: bold;
      color: #ff8c00;
      white-space: nowrap;
    }

    .boton-quitar-item {
      background: none;
      border: none;
      color: #cccccc;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }

    .boton-quitar-item:hover {
      color: #ff8c00;
    }

    .pie-carrito {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding-top: 14px;
      margin-top: 6px;
      border-top: 1px solid #ff8c00;
    }

    .total-carrito-fila {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: bold;
    }

    .total-carrito-fila span:last-child {
      color: #ff8c00;
    }

    .fila-subtotal-carrito,
    .fila-impuesto-carrito {
      font-size: 13px;
      font-weight: normal;
      color: #cccccc;
    }

    .fila-subtotal-carrito span:last-child,
    .fila-impuesto-carrito span:last-child {
      color: #cccccc;
    }

    .tipo-pedido-carrito {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .opciones-tipo-pedido {
      display: flex;
      gap: 8px;
    }

    .boton-tipo-pedido {
      flex: 1;
      background-color: transparent;
      border: 1px solid #ff8c00;
      color: #ff8c00;
      border-radius: 20px;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .boton-tipo-pedido.tipo-activo {
      background-color: #ff8c00;
      color: #000000;
    }

    .metodo-pago-carrito {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pago-titulo {
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
    }

    .opciones-pago {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .boton-pago {
      flex: 1 1 calc(50% - 8px);
      background-color: transparent;
      border: 1px solid #ff8c00;
      color: #ff8c00;
      border-radius: 20px;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .boton-pago.pago-activo {
      background-color: #ff8c00;
      color: #000000;
    }

    .boton-finalizar {
      background-color: #ff8c00;
      color: #000000;
      border: none;
      border-radius: 30px;
      padding: 12px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .boton-vaciar {
      background: none;
      border: none;
      color: #cccccc;
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      padding: 4px;
    }

    @media (max-width: 600px) {
      .boton-carrito-flotante {
        bottom: 14px;
        right: 14px;
        width: 50px;
        height: 50px;
      }
      .boton-ajustes-flotante {
        bottom: 14px;
        left: 14px;
        width: 34px;
        height: 34px;
        font-size: 15px;
      }
      .panel-carrito {
        max-height: 85vh;
        padding: 16px;
      }

          </div>
          <h3>${item.nombre}</h3>
          <p class="descripcion-platillo">${item.descripcion || ''}</p>
          ${precioHTML}
          <div class="control-cantidad-tarjeta">
            <button type="button" class="boton-cantidad-tarjeta" onclick="restarEnTarjeta(this)" aria-label="Quitar uno">−</button>
            <span class="cantidad-tarjeta">0</span>
            <button type="button" class="boton-cantidad-tarjeta" onclick="sumarEnTarjeta(this)" aria-label="Agregar uno">+</button>
          </div>
        </div>
      `;
    }

    function renderizarGrid(idContenedor, items, extraClase) {
      const contenedor = document.getElementById(idContenedor);
      if (!contenedor) return;
      contenedor.innerHTML = items.map(it => crearTarjetaHTML(it, extraClase)).join('');
    }

    function itemsMasVendidos() {
      return SITIO.items
        .filter(it => it.activo !== false && it.categoria !== 'promocion' && it.categoria !== 'mas-vendido')
        .filter(it => (it.ventasSemana || 0) > 0)
        .slice()
        .sort((a, b) => (b.ventasSemana || 0) - (a.ventasSemana || 0))
        .slice(0, 3);
    }

    function renderizarMasVendidos() {
      const items = itemsMasVendidos();
      renderizarGrid('grid-mas-vendidos', items);
      const seccion = document.querySelector('.seccion-mas-vendidos');
      if (seccion) seccion.classList.toggle('vista-oculta', items.length === 0);
    }

    function renderizarPromociones() {
      const items = itemsPorCategoria('promocion');
      renderizarGrid('grid-promociones', items, 'tarjeta-promocion');
      const seccion = document.getElementById('seccion-promociones');
      const visible = SITIO.config.promocionesVisibles !== false && items.length > 0;
      if (seccion) seccion.classList.toggle('vista-oculta', !visible);
    }

    function renderizarConSubcategorias(categoria, idTabs, idGrid) {
      const items = itemsPorCategoria(categoria);
      const cfg = CONFIG_SUBCATEGORIA[categoria] || { orden: [], defecto: 'general' };
      const presentes = [...new Set(items.map(it => it.subcategoria || cfg.defecto))];
      presentes.sort((a, b) => {
        const ia = cfg.orden.indexOf(a);
        const ib = cfg.orden.indexOf(b);
        if (ia === -1 && ib === -1) return a.localeCompare(b);
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      });

      const necesitaTabs = presentes.length > 1;
      const tabsEl = document.getElementById(idTabs);
      if (tabsEl) {
        tabsEl.innerHTML = necesitaTabs ? presentes.map((clave, i) => (
          `<button type="button" class="boton-categoria${i === 0 ? ' categoria-activa' : ''}" onclick="filtrarSubcategoria('${idGrid}', '${idTabs}', '${clave}', this)">${etiquetaSubcategoria(clave)}</button>`
        )).join('') : '';
      }

      const gridEl = document.getElementById(idGrid);
      if (gridEl) {
        gridEl.innerHTML = items.map(it => {
          const clave = it.subcategoria || cfg.defecto;
          const oculta = (necesitaTabs && clave !== presentes[0]) ? 'tarjeta-oculta-categoria' : '';
          return crearTarjetaHTML(it, oculta);
        }).join('');
      }
    }

    function renderizarBebidas() {
      renderizarConSubcategorias('bebida', 'tabs-bebidas', 'grid-bebidas');
    }

    function renderizarExtras() {
      renderizarConSubcategorias('extra', 'tabs-extras', 'grid-extras');
    }

    function renderizarComida() {
      renderizarConSubcategorias('comida', 'tabs-comida', 'grid-comida');
    }

    function renderizarCategoriasPersonalizadas() {
      const categorias = (SITIO.config && SITIO.config.categoriasPersonalizadas) || [];

      document.querySelectorAll('.seccion-categoria-personalizada').forEach(el => el.remove());
      document.querySelectorAll('.boton-categoria-personalizada').forEach(el => el.remove());

      const navMenu = document.querySelector('#vista-menu nav.opciones');
      const botonVolverMenu = navMenu ? navMenu.querySelector('.boton-volver') : null;
      const contenedor = document.querySelector('.contenedor');
      if (!navMenu || !botonVolverMenu || !contenedor) return;

      categorias.forEach(cat => {
        const idVista = 'vista-cat-' + cat.clave;
        const idGrid = 'grid-cat-' + cat.clave;

        const boton = document.createElement('a');
        boton.href = 'javascript:void(0)';
        boton.className = 'boton-opcion boton-categoria-personalizada';
        boton.textContent = cat.nombre;
        boton.setAttribute('onclick', `mostrarVista('${idVista}')`);
        navMenu.insertBefore(boton, botonVolverMenu);

        const seccion = document.createElement('section');
        seccion.id = idVista;
        seccion.className = 'vista-oculta vista-nivel seccion-categoria-personalizada';
        seccion.innerHTML = `
          <div class="encabezado-seccion">
            <h2 class="titulo-seccion titulo-activo">${cat.nombre}</h2>
            <a href="javascript:void(0)" class="boton-volver boton-volver-derecha" onclick="mostrarVista('vista-menu')">&#8592; Volver</a>
          </div>
          <div class="cuadricula-platillos" id="${idGrid}"></div>
        `;
        contenedor.appendChild(seccion);

        renderizarGrid(idGrid, itemsPorCategoria(cat.clave));
      });
    }

    function aplicarConfiguracion() {
      const cfg = SITIO.config || {};
      const elWhatsappGeneral = document.getElementById('enlace-whatsapp-general');
      if (elWhatsappGeneral && cfg.whatsappGeneral) elWhatsappGeneral.href = `https://wa.me/${cfg.whatsappGeneral}`;
      const elInstagram = document.getElementById('enlace-instagram');
      if (elInstagram && cfg.instagramUrl) elInstagram.href = cfg.instagramUrl;
      const elUbicacion = document.getElementById('enlace-ubicacion');
      if (elUbicacion && cfg.ubicacionUrl) elUbicacion.href = cfg.ubicacionUrl;
      const elTituloPromo = document.getElementById('titulo-promociones');
      if (elTituloPromo && cfg.tituloPromociones) elTituloPromo.textContent = cfg.tituloPromociones;
      if (cfg.fondoPersonalizado) {
        document.body.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.82), rgba(0,0,0,0.82)), url("${cfg.fondoPersonalizado}")`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundRepeat = 'no-repeat';
        document.body.style.backgroundPosition = 'center';
      }
    }

    function renderizarSitio() {
      aplicarConfiguracion();
      renderizarPromociones();
      renderizarMasVendidos();
      renderizarComida();
      renderizarBebidas();
      renderizarExtras();
      renderizarCategoriasPersonalizadas();
      renderizarMetodosPago();
      sincronizarTarjetas();
    }

    function mostrarVista(idVista) {
      document.querySelectorAll('.vista-nivel').forEach(el => el.classList.add('vista-oculta'));
      document.getElementById(idVista).classList.remove('vista-oculta');
    }

    function filtrarSubcategoria(idGrid, idTabs, clave, boton) {
      document.querySelectorAll('#' + idTabs + ' .boton-categoria').forEach(b => b.classList.remove('categoria-activa'));
      boton.classList.add('categoria-activa');
      document.querySelectorAll('#' + idGrid + ' .tarjeta-platillo').forEach(tarjeta => {
        if (tarjeta.dataset.categoria === clave) {
          tarjeta.classList.remove('tarjeta-oculta-categoria');
        } else {
          tarjeta.classList.add('tarjeta-oculta-categoria');
        }
      });
    }

    function actualizarFechaHora() {
      const ahora = new Date();
      const opcionesFecha = { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' };
      const fecha = ahora.toLocaleDateString('es-ES', opcionesFecha);
      const hora = ahora.toLocaleTimeString('es-ES');
      document.getElementById('fecha').textContent = fecha;
      document.getElementById('hora').textContent = hora;
    }
    actualizarFechaHora();
    setInterval(actualizarFechaHora, 1000);

    /* ===== Carrito de compras ===== */
    let carrito = [];
    try {
      carrito = JSON.parse(localStorage.getItem('carritoONCE')) || [];
    } catch (e) {
      carrito = [];
    }

    let tipoPedido = 'llevar';

    function seleccionarTipoPedido(tipo, boton) {
      tipoPedido = tipo;
      document.querySelectorAll('.boton-tipo-pedido').forEach(b => b.classList.remove('tipo-activo'));
      boton.classList.add('tipo-activo');
    }

    let metodoPago = 'efectivo';
    const nombresMetodoPago = {
      efectivo: 'Efectivo',
      yappy: 'Yappy',
      tarjeta: 'Tarjeta',
      transferencia: 'Transferencia/ACH'
    };

    function seleccionarMetodoPago(pago, boton) {
      metodoPago = pago;
      document.querySelectorAll('.boton-pago').forEach(b => b.classList.remove('pago-activo'));
      boton.classList.add('pago-activo');
    }

    function renderizarMetodosPago() {
      const visibles = (SITIO.config && SITIO.config.metodosPagoVisibles) || {};
      const claves = Object.keys(nombresMetodoPago).filter(clave => visibles[clave] !== false);
      const contenedor = document.getElementById('opciones-pago');
      const seccion = document.getElementById('metodo-pago-carrito');
      if (!contenedor) return;

      if (claves.length === 0) {
        if (seccion) seccion.classList.add('vista-oculta');
        contenedor.innerHTML = '';
        metodoPago = '';
        return;
      }
      if (seccion) seccion.classList.remove('vista-oculta');

      if (!claves.includes(metodoPago)) {
        metodoPago = claves[0];
      }

      contenedor.innerHTML = claves.map(clave => (
        `<button type="button" class="boton-pago${clave === metodoPago ? ' pago-activo' : ''}" data-pago="${clave}" onclick="seleccionarMetodoPago('${clave}', this)">${nombresMetodoPago[clave]}</button>`
      )).join('');
    }

    function guardarCarrito() {
      try {
        localStorage.setItem('carritoONCE', JSON.stringify(carrito));
      } catch (e) {}
      actualizarContadorCarrito();
    }

    function sumarEnTarjeta(boton) {
      cambiarCantidadEnTarjeta(boton.closest('.tarjeta-platillo'), 1);
    }

    function restarEnTarjeta(boton) {
      cambiarCantidadEnTarjeta(boton.closest('.tarjeta-platillo'), -1);
    }

    function cambiarCantidadEnTarjeta(tarjeta, delta) {
      const id = tarjeta.dataset.id;
      const nombre = tarjeta.dataset.nombre;
      const precio = parseFloat(tarjeta.dataset.precio) || 0;
      let item = carrito.find(i => i.id === id);
      if (!item) {
        if (delta <= 0) return;
        item = { id, nombre, precio, cantidad: 0 };
        carrito.push(item);
      }
      item.cantidad += delta;
      if (item.cantidad <= 0) {
        carrito = carrito.filter(i => i.id !== id);
      }
      guardarCarrito();
      actualizarCantidadEnTarjeta(id);
    }

    function actualizarCantidadEnTarjeta(id) {
      const tarjetas = document.querySelectorAll(`.tarjeta-platillo[data-id="${id}"]`);
      if (!tarjetas.length) return;
      const item = carrito.find(i => i.id === id);
      const cantidad = item ? item.cantidad : 0;
      tarjetas.forEach(tarjeta => {
        const span = tarjeta.querySelector('.cantidad-tarjeta');
        if (span) span.textContent = cantidad;
      });
    }

    function sincronizarTarjetas() {
      document.querySelectorAll('.tarjeta-platillo').forEach(tarjeta => {
        actualizarCantidadEnTarjeta(tarjeta.dataset.id);
      });
    }

    function cambiarCantidad(id, delta) {
      const item = carrito.find(i => i.id === id);
      if (!item) return;
      item.cantidad += delta;
      if (item.cantidad <= 0) {
        carrito = carrito.filter(i => i.id !== id);
      }
      guardarCarrito();
      renderizarCarrito();
      actualizarCantidadEnTarjeta(id);
    }

    function eliminarDelCarrito(id) {
      carrito = carrito.filter(i => i.id !== id);
      guardarCarrito();
      renderizarCarrito();
      actualizarCantidadEnTarjeta(id);
    }

    function vaciarCarrito() {
      carrito = [];
      guardarCarrito();
      renderizarCarrito();
      sincronizarTarjetas();
    }

    function totalCarrito() {
      return carrito.reduce((suma, i) => suma + i.precio * i.cantidad, 0);
    }

    function calcularTotales() {
      const subtotal = totalCarrito();
      const mostrarImpuesto = !!(SITIO.config && SITIO.config.mostrarDesglosImpuesto);
      const impuesto = mostrarImpuesto ? subtotal * 0.07 : 0;
      const total = subtotal + impuesto;
      return { subtotal, impuesto, total, mostrarImpuesto };
    }

    function actualizarContadorCarrito() {
      const totalItems = carrito.reduce((suma, i) => suma + i.cantidad, 0);
      const badge = document.getElementById('contador-carrito');
      if (!badge) return;
      badge.textContent = totalItems;
      badge.style.display = totalItems > 0 ? 'flex' : 'none';
    }

    function renderizarCarrito() {
      const contenedor = document.getElementById('items-carrito');
      const vacio = document.getElementById('carrito-vacio');
      const totalEl = document.getElementById('total-carrito');
      const pieCarrito = document.getElementById('pie-carrito');
      contenedor.innerHTML = '';
      if (carrito.length === 0) {
        vacio.style.display = 'block';
        pieCarrito.style.display = 'none';
      } else {
        vacio.style.display = 'none';
        pieCarrito.style.display = 'flex';
        carrito.forEach(item => {
          const fila = document.createElement('div');
          fila.className = 'fila-carrito';
          fila.innerHTML = `
            <div class="info-item-carrito">
              <span class="nombre-item-carrito">${item.nombre}</span>
              <span class="precio-item-carrito">$${item.precio.toFixed(2)} c/u</span>
            </div>
            <div class="controles-item-carrito">
              <button type="button" class="boton-cantidad" onclick="cambiarCantidad('${item.id}', -1)" aria-label="Restar">−</button>
              <span class="cantidad-item-carrito">${item.cantidad}</span>
              <button type="button" class="boton-cantidad" onclick="cambiarCantidad('${item.id}', 1)" aria-label="Sumar">+</button>
            </div>
            <span class="subtotal-item-carrito">$${(item.precio * item.cantidad).toFixed(2)}</span>
            <button type="button" class="boton-quitar-item" onclick="eliminarDelCarrito('${item.id}')" aria-label="Quitar">&times;</button>
          `;
          contenedor.appendChild(fila);
        });
      }
      const { subtotal, impuesto, total, mostrarImpuesto } = calcularTotales();
      const filaSubtotal = document.getElementById('fila-subtotal-carrito');
      const filaImpuesto = document.getElementById('fila-impuesto-carrito');
      if (filaSubtotal) filaSubtotal.classList.toggle('vista-oculta', !mostrarImpuesto);
      if (filaImpuesto) filaImpuesto.classList.toggle('vista-oculta', !mostrarImpuesto);
      const subtotalEl = document.getElementById('subtotal-carrito');
      const impuestoEl = document.getElementById('impuesto-carrito');
      if (subtotalEl) subtotalEl.textContent = `$${subtotal.toFixed(2)}`;
      if (impuestoEl) impuestoEl.textContent = `$${impuesto.toFixed(2)}`;
      totalEl.textContent = `$${total.toFixed(2)}`;
    }

    function abrirCarrito() {
      renderizarCarrito();
      document.getElementById('modal-carrito').classList.remove('vista-oculta');
      document.body.style.overflow = 'hidden';
    }

    function cerrarCarrito() {
      document.getElementById('modal-carrito').classList.add('vista-oculta');
      document.body.style.overflow = '';
    }

    function finalizarPedido() {
      if (carrito.length === 0) return;
      const textoTipo = tipoPedido === 'llevar' ? 'Para llevar' : 'Para comer en el local';
      let mensaje = 'Hola, quiero hacer este pedido:\n\n';
      carrito.forEach(item => {
        mensaje += `• ${item.cantidad}x ${item.nombre} - $${(item.precio * item.cantidad).toFixed(2)}\n`;
      });
      const { subtotal, impuesto, total, mostrarImpuesto } = calcularTotales();
      if (mostrarImpuesto) {
        mensaje += `\nSubtotal: $${subtotal.toFixed(2)}`;
        mensaje += `\nITBMS (7%): $${impuesto.toFixed(2)}`;
      }
      mensaje += `\nTotal: $${total.toFixed(2)}`;
      mensaje += `\n${textoTipo}`;
      if (metodoPago && nombresMetodoPago[metodoPago]) {
        mensaje += `\nPago: ${nombresMetodoPago[metodoPago]}`;
      }
      const url = `https://wa.me/${SITIO.config.whatsappPedidos}?text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
    }

    renderizarSitio();
    actualizarContadorCarrito();
  </script>

</body>
</html>
